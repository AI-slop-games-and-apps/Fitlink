name: Build & Deploy FitLink (Pages, Debian & Android)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages-build:
    name: Build Web App (GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build production bundle
        env:
          RAW_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "${RAW_BASE_PATH}" ]; then
            export VITE_BASE_PATH="${RAW_BASE_PATH%/}/"
          else
            export VITE_BASE_PATH="./"
          fi
          echo "Building with VITE_BASE_PATH=${VITE_BASE_PATH}"
          npm run build
          rm -rf dist/assets/aistudio
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages-deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [ pages-build ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  debian:
    name: Debian ${{ matrix.arch }} (.deb)
    needs: [ pages-build, pages-deploy ]
    if: ${{ always() && needs.pages-build.result == 'success' && (needs.pages-deploy.result == 'success' || needs.pages-deploy.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      - name: Install Debian Qt 6 build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git file fakeroot build-essential cmake ninja-build pkgconf \
            qt6-base-dev qt6-declarative-dev qt6-connectivity-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Debian ${{ matrix.arch }} package
        working-directory: qt
        run: |
          chmod +x ./scripts/build-debian.sh ./debian/rules
          ./scripts/build-debian.sh ${{ matrix.arch }}
          DEB_FILE="$(find "build-debian-${{ matrix.arch }}" -maxdepth 1 -name "*.deb" | head -n 1)"
          if [ -z "${DEB_FILE}" ]; then
            echo "No .deb package generated!"
            exit 1
          fi
          mkdir -p "dist-${{ matrix.arch }}"
          cp "${DEB_FILE}" "dist-${{ matrix.arch }}/fitlink-debian-${{ matrix.arch }}.deb"
          ls -lh "dist-${{ matrix.arch }}"

      - name: Upload Debian ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitlink-debian-${{ matrix.arch }}
          path: qt/dist-${{ matrix.arch }}/fitlink-debian-${{ matrix.arch }}.deb
          if-no-files-found: error

  android:
    name: Android APK (${{ matrix.abi }})
    needs: [ pages-build, pages-deploy ]
    if: ${{ always() && needs.pages-build.result == 'success' && (needs.pages-deploy.result == 'success' || needs.pages-deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: armeabi-v7a
            qt_arch: android_armv7
    env:
      QT_VERSION: '6.9.3'
      ANDROID_COMPILE_SDK: '35'
      ANDROID_BUILD_TOOLS: '35.0.1'
      ANDROID_NDK_VERSION: '27.2.12479018'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ninja and Android SDK/NDK components
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Qt ${{ env.QT_VERSION }} host tools (Linux desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/qt-host
          cache: true
          cache-key-prefix: qt-host-

      - name: Install Qt ${{ env.QT_VERSION }} for Android (${{ matrix.qt_arch }})
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: ${{ matrix.qt_arch }}
          modules: qtconnectivity
          dir: ${{ runner.temp }}/qt-android
          cache: true
          cache-key-prefix: qt-${{ matrix.qt_arch }}-

      - name: Configure and build Android APK (${{ matrix.abi }})
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x qt/scripts/build-android.sh
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"
          NINJA_BIN="$(command -v ninja)"
          if [ ! -d "${ANDROID_NDK_ROOT}" ]; then
            echo "Android NDK not found at ${ANDROID_NDK_ROOT}!"
            ls -la "${ANDROID_SDK_ROOT}/ndk" || true
            exit 1
          fi
          QT_HOST_CMAKE="$(find "${{ runner.temp }}/qt-host" -path "*/gcc_64/bin/qt-cmake" -type f | head -n 1)"
          QT_ANDROID_CMAKE="$(find "${{ runner.temp }}/qt-android" -path "*/${{ matrix.qt_arch }}/bin/qt-cmake" -type f | head -n 1)"
          if [ -z "${QT_HOST_CMAKE}" ] || [ -z "${QT_ANDROID_CMAKE}" ]; then
            echo "Could not locate host or Android qt-cmake!"
            find "${{ runner.temp }}/qt-host" "${{ runner.temp }}/qt-android" -maxdepth 4
            exit 1
          fi
          QT_HOST_DIR="$(dirname "$(dirname "${QT_HOST_CMAKE}")")"
          chmod +x "${QT_ANDROID_CMAKE}"
          echo "Using ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "Using ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT}"
          echo "Using NINJA_BIN=${NINJA_BIN}"
          echo "Using QT_HOST_DIR=${QT_HOST_DIR}"
          echo "Using QT_ANDROID_CMAKE=${QT_ANDROID_CMAKE}"
          "${QT_ANDROID_CMAKE}" \
            -S qt \
            -B "qt/build-android-${{ matrix.abi }}" \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM="${NINJA_BIN}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="${QT_HOST_DIR}" \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF
          cmake --build "qt/build-android-${{ matrix.abi }}" --target apk --parallel
          RAW_APK="$(find "qt/build-android-${{ matrix.abi }}" -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)"
          if [ -z "${RAW_APK}" ]; then
            echo "No .apk package generated!"
            find "qt/build-android-${{ matrix.abi }}" -name "*.apk" -print
            exit 1
          fi
          echo "Raw APK built: ${RAW_APK}"

          KEYSTORE_PATH="${{ runner.temp }}/fitlink-signing.jks"
          rm -f "${KEYSTORE_PATH}"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
            KS_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD}}"
            echo "Signing APK with configured repository release keystore."
          else
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -storepass fitlink-ci-keystore \
              -alias fitlink \
              -keypass fitlink-ci-keystore \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=FitLink, OU=Mobile, O=FitLink, L=Unknown, ST=Unknown, C=US"
            KS_PASS="fitlink-ci-keystore"
            KEY_ALIAS="fitlink"
            KEY_PASS="fitlink-ci-keystore"
            echo "Signing APK with generated CI keystore (set ANDROID_KEYSTORE_* secrets for persistent update signing)."
          fi

          mkdir -p "qt/dist-${{ matrix.abi }}"
          ALIGNED_APK="${{ runner.temp }}/fitlink-android-${{ matrix.abi }}-aligned.apk"
          SIGNED_APK="qt/dist-${{ matrix.abi }}/fitlink-android-${{ matrix.abi }}.apk"

          "${BUILD_TOOLS_DIR}/zipalign" -P 16 -f 4 "${RAW_APK}" "${ALIGNED_APK}"
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks "${KEYSTORE_PATH}" \
            --ks-pass "pass:${KS_PASS}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASS}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"

          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose "${SIGNED_APK}"
          "${BUILD_TOOLS_DIR}/aapt2" dump badging "${SIGNED_APK}" | head -n 20
          rm -f "${KEYSTORE_PATH}" "${ALIGNED_APK}"
          ls -lh "qt/dist-${{ matrix.abi }}"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitlink-android-${{ matrix.abi }}
          path: qt/dist-${{ matrix.abi }}/fitlink-android-${{ matrix.abi }}.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: [ debian, android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Update rolling latest tag
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin refs/tags/latest
          # Give GitHub a few seconds to index the updated tag ref before updating the release
          sleep 3

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p release-assets
          find dist-artifacts -type f \( -name "*.deb" -o -name "*.apk" \) -exec cp -v {} release-assets/ \;
          ASSETS=(release-assets/*)
          if [ ! -e "${ASSETS[0]}" ]; then
            echo "No .deb or .apk release assets found!"
            exit 1
          fi
          ls -lh release-assets/

          retry() {
            local max_attempts=4
            local attempt=1
            local delay=5
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt} failed (transient GitHub API error). Retrying in ${delay}s..."
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay + 5))
            done
          }

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if gh release view "${TAG}" >/dev/null 2>&1; then
              retry gh release edit "${TAG}" --latest
              retry gh release upload "${TAG}" "${ASSETS[@]}" --clobber
            else
              retry gh release create "${TAG}" "${ASSETS[@]}" \
                --generate-notes \
                --latest
            fi
          else
            TAG="latest"
            cat <<EOF > release-notes.md
          Automated build from commit \`${GITHUB_SHA}\`.

          ### Included Packages
          - \`fitlink-debian-amd64.deb\` — Debian Linux (64-bit x86_64)
          - \`fitlink-debian-arm64.deb\` — Debian Linux (64-bit ARM / Raspberry Pi / ARM64)
          - \`fitlink-android-arm64-v8a.apk\` — Android (64-bit ARM)
          - \`fitlink-android-armeabi-v7a.apk\` — Android (32-bit ARM)
          EOF

            if gh release view "${TAG}" >/dev/null 2>&1; then
              retry gh release edit "${TAG}" \
                --title "FitLink Latest Build" \
                --notes-file release-notes.md \
                --latest
              retry gh release upload "${TAG}" "${ASSETS[@]}" --clobber
            else
              retry gh release create "${TAG}" "${ASSETS[@]}" \
                --title "FitLink Latest Build" \
                --notes-file release-notes.md \
                --latest
            fi
          fi
